name: CI — Integración Continua 

# ───────────────────────────────────────────────────────────────── 

# Disparadores: push a master/develop y cualquier Pull Request a master 

# ───────────────────────────────────────────────────────────────── 

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validar backend
    runs-on: ubuntu-latest

    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend

      - name: Ejecutar pruebas
        shell: bash
        run: |
          if [ -d "backend/tests" ] || compgen -G "backend/test_*.py" > /dev/null; then
            pytest backend -v
          else
            echo "No se encontraron pruebas; se omite pytest."
          fi

