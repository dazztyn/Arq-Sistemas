name: CI — Integración Continua 

# ───────────────────────────────────────────────────────────────── 

# Disparadores: push a master/develop y cualquier Pull Request a master 

# ───────────────────────────────────────────────────────────────── 

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validar backend
    runs-on: ubuntu-latest

    # En CI no existe un .env, así que las variables se definen acá.
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/suscripciones_db
      SECRET_KEY: clave_desechable_solo_para_ejecutar_los_tests
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: suscripciones_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend

      # El proyecto exige un mínimo de 60% de cobertura: --cov-fail-under hace que el
      # pipeline falle si baja de ahí, en vez de tener que revisarlo a mano.
      - name: Ejecutar pruebas
        shell: bash
        run: |
          if [ -d "backend/tests" ] || compgen -G "backend/test_*.py" > /dev/null; then
            pytest backend -v --cov=backend --cov-report=term-missing --cov-fail-under=60
          else
            echo "No se encontraron pruebas; se omite pytest."
          fi

      - name: Construir imagen Docker del backend
        run: docker build -t arq-sistemas-backend ./backend